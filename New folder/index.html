<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lịch dạy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <button class="menu-btn" aria-label="Mở menu">
        <span></span><span></span><span></span>
      </button>
    </header>

    <main class="content">
      <section class="schedule-card" aria-label="Lịch dạy">
        <h1>Lịch dạy</h1>
      </section>

      <section class="lesson">
        <p class="lesson-time">Thời gian</p>
        <div class="lesson-row">
          <div class="student-name">Tên học sinh A</div>
          <button class="btn btn-accept" aria-label="Đồng ý"></button>
          <button class="btn btn-decline" aria-label="Từ chối"></button>
        </div>
      </section>

      <section class="lesson">
        <p class="lesson-time">Thời gian</p>
        <div class="lesson-row">
          <div class="student-name">Tên học sinh B</div>
          <button class="btn btn-accept" aria-label="Đồng ý"></button>
          <button class="btn btn-decline" aria-label="Từ chối"></button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
