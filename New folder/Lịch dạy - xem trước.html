<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lịch dạy</title>
  <style>
:root {
  --page-bg: #a0a0a0;
  --frame-bg: #ffffff;
  --panel: #d9d9d9;
  --text: #1a1a1a;
  --accept: #73c46a;
  --decline: #dc2222;
  --radius-lg: 22px;
  --radius-pill: 28px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  background: var(--page-bg);
  color: var(--text);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 24px 12px;
}

/* Khung điện thoại */
.phone {
  width: 100%;
  max-width: 380px;
  min-height: 440px;
  background: var(--frame-bg);
  border-right: 2px solid #000;
  padding: 0 16px 28px;
  position: relative;
  overflow: hidden;
}

/* Thanh trên cùng + nút menu */
.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0 6px;
}
.page-title {
  font-size: 1.125rem;
  font-weight: 500;
}

.menu-btn {
  width: 32px;
  height: 28px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  background: none;
  border: 0;
  cursor: pointer;
}
.menu-btn span {
  display: block;
  height: 4px;
  border-radius: 2px;
  background: #b9b9b9;
}
.menu-btn:focus-visible,
.btn:focus-visible { outline: 3px solid #1a73e8; outline-offset: 2px; }

/* Lịch theo tuần */
.schedule-card {
  background: var(--panel);
  border-radius: var(--radius-lg);
  margin: 14px 0 20px;
  padding: 14px 10px 12px;
}

.week-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.week-header h1 {
  font-size: 1.0625rem;
  font-weight: 500;
  text-align: center;
}

.week-nav {
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  font-size: 1.5rem;
  line-height: 1;
  color: var(--text);
  cursor: pointer;
}
.week-nav:hover { background: rgba(255, 255, 255, 0.55); }
.week-nav:focus-visible,
.day:focus-visible,
.today-btn:focus-visible { outline: 3px solid #1a73e8; outline-offset: 2px; }

.week-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.day {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 0;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--text);
  font: inherit;
  cursor: pointer;
}
.day:hover { background: rgba(255, 255, 255, 0.55); }
.day-name { font-size: 0.75rem; color: #555; }
.day-num  { font-size: 1.0625rem; font-weight: 500; }
.day.is-today .day-num { text-decoration: underline; text-underline-offset: 3px; }
.day.is-selected { background: #fff; }
.day.is-selected .day-name { color: var(--text); }

.today-btn {
  display: block;
  margin: 10px auto 0;
  padding: 4px 14px;
  border: 0;
  border-radius: 14px;
  background: #fff;
  font: inherit;
  font-size: 0.8125rem;
  cursor: pointer;
}

/* Tiêu đề ngày + trạng thái trống */
.day-heading {
  font-size: 0.9375rem;
  font-weight: 500;
  color: #555;
  margin: 0 0 12px 5px;
}
.empty-state {
  background: var(--panel);
  border-radius: var(--radius-pill);
  padding: 22px 18px;
  text-align: center;
  color: #555;
}

/* Mỗi buổi học */
.lesson { margin-bottom: 6px; }

.lesson-time {
  font-size: 1.0625rem;
  margin: 0 0 6px 5px;
}

.lesson-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--panel);
  border-radius: var(--radius-pill);
  padding: 14px 14px 14px 14px;
}

.student-name {
  flex: 1;
  background: #fff;
  padding: 10px 14px;
  font-size: 1.0625rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Nút đồng ý / từ chối */
.btn {
  width: 32px;
  height: 22px;
  border: 0;
  border-radius: 4px;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.12s ease, filter 0.12s ease;
}
.btn:hover { filter: brightness(0.92); }
.btn:active { transform: scale(0.94); }
.btn-accept  { background: var(--accept); }
.btn-decline { background: var(--decline); }

/* Menu trượt */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
  z-index: 10;
}

.drawer {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 78%;
  max-width: 280px;
  background: var(--frame-bg);
  border-right: 2px solid #000;
  padding: 12px 0;
  z-index: 11;
  transform: translateX(-100%);
  visibility: hidden;
  transition: transform 0.25s ease, visibility 0.25s;
}
.drawer.is-open { transform: translateX(0); visibility: visible; }

.drawer-close {
  display: block;
  margin: 0 8px 8px auto;
  width: 36px;
  height: 36px;
  border: 0;
  background: none;
  font-size: 1.75rem;
  line-height: 1;
  color: #777;
  cursor: pointer;
}

.drawer ul { list-style: none; }
.drawer a {
  display: block;
  padding: 14px 22px;
  color: var(--text);
  text-decoration: none;
  font-size: 1.0625rem;
}
.drawer a:hover { background: #f0f0f0; }
.drawer a.is-active { background: var(--panel); }
.drawer a:focus-visible,
.drawer-close:focus-visible { outline: 3px solid #1a73e8; outline-offset: -3px; }

@media (prefers-reduced-motion: reduce) {
  .drawer { transition: none; }
}

@media (max-width: 400px) {
  body { padding: 0; }
  .phone { max-width: none; border-right: 0; }
}

</style>
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Mở menu" aria-expanded="false" aria-controls="menu">
        <span></span><span></span><span></span>
      </button>
      <h2 class="page-title">Trang chủ</h2>
    </header>

    <main class="content">
      <section class="schedule-card" aria-label="Lịch dạy theo tuần">
        <div class="week-header">
          <button class="week-nav" id="prev-week" aria-label="Tuần trước">&#8249;</button>
          <h1 id="week-range">Lịch dạy</h1>
          <button class="week-nav" id="next-week" aria-label="Tuần sau">&#8250;</button>
        </div>
        <div class="week-days" id="week-days" role="group" aria-label="Các ngày trong tuần"></div>
        <button class="today-btn" id="today-btn">Hôm nay</button>
      </section>
      <h3 class="day-heading" id="day-heading"></h3>
      <div id="lessons" aria-live="polite"></div>
    </main>

    <div class="overlay" id="overlay" hidden></div>
    <nav class="drawer" id="menu" aria-label="Menu chính" aria-hidden="true">
      <button class="drawer-close" id="menu-close" aria-label="Đóng menu">&times;</button>
      <ul>
        <li><a href="#" class="is-active" aria-current="page">Trang chủ</a></li>
        <li><a href="#">Cập nhật lịch dạy</a></li>
        <li><a href="#">Thêm học sinh</a></li>
        <li><a href="#">Tổng buổi dạy</a></li>
      </ul>
    </nav>
  </div>
  <script>
const DAY_NAMES = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"];
const DAY_FULL = ["Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy", "Chủ nhật"];

/* Lịch dạy cố định theo thứ trong tuần (0 = Thứ Hai ... 6 = Chủ nhật).
   Sửa dữ liệu ở đây: { time: "giờ bắt đầu", student: "tên học sinh" } */
const WEEKLY_LESSONS = {
  0: [{ time: "17:00", student: "Nguyễn Minh An" }, { time: "19:00", student: "Trần Bảo Ngọc" }],
  1: [{ time: "18:00", student: "Lê Hoàng Nam" }],
  2: [{ time: "17:30", student: "Nguyễn Minh An" }, { time: "19:30", student: "Phạm Gia Hân" }],
  3: [{ time: "18:00", student: "Trần Bảo Ngọc" }],
  4: [{ time: "17:00", student: "Lê Hoàng Nam" }, { time: "19:00", student: "Phạm Gia Hân" }],
  5: [{ time: "08:00", student: "Nguyễn Minh An" }, { time: "10:00", student: "Trần Bảo Ngọc" }],
  6: []
};

const daysEl = document.getElementById("week-days");
const rangeEl = document.getElementById("week-range");

let selected = new Date();
let weekStart = getMonday(selected);

function getMonday(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const offset = (d.getDay() + 6) % 7; // Thứ 2 = 0
  d.setDate(d.getDate() - offset);
  return d;
}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}

function pad(n) { return String(n).padStart(2, "0"); }

function renderLessons() {
  const idx = (selected.getDay() + 6) % 7;
  const today = new Date();
  const label = sameDay(selected, today) ? "Hôm nay" : DAY_FULL[idx];
  document.getElementById("day-heading").textContent =
    `${label}, ${pad(selected.getDate())}/${pad(selected.getMonth() + 1)}`;

  const list = [...(WEEKLY_LESSONS[idx] || [])].sort((a, b) => a.time.localeCompare(b.time));
  const box = document.getElementById("lessons");

  if (list.length === 0) {
    box.innerHTML = '<p class="empty-state">Không có buổi dạy nào trong ngày này</p>';
    return;
  }

  box.innerHTML = list.map((l) => `
    <section class="lesson">
      <p class="lesson-time">Bắt đầu ${l.time}</p>
      <div class="lesson-row">
        <div class="student-name">${l.student}</div>
        <button class="btn btn-accept" aria-label="Đồng ý"></button>
        <button class="btn btn-decline" aria-label="Từ chối"></button>
      </div>
    </section>`).join("");
}

function render() {
  const today = new Date();
  daysEl.innerHTML = "";

  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);

    const btn = document.createElement("button");
    btn.className = "day";
    if (sameDay(d, today)) btn.classList.add("is-today");
    if (sameDay(d, selected)) btn.classList.add("is-selected");
    btn.setAttribute("aria-pressed", sameDay(d, selected));
    btn.innerHTML =
      `<span class="day-name">${DAY_NAMES[i]}</span>` +
      `<span class="day-num">${d.getDate()}</span>`;
    btn.addEventListener("click", () => { selected = d; render(); });
    daysEl.appendChild(btn);
  }

  const end = new Date(weekStart);
  end.setDate(weekStart.getDate() + 6);
  rangeEl.textContent =
    `${pad(weekStart.getDate())}/${pad(weekStart.getMonth() + 1)} – ` +
    `${pad(end.getDate())}/${pad(end.getMonth() + 1)}/${end.getFullYear()}`;

  renderLessons();
}

function shiftWeek(n) {
  weekStart.setDate(weekStart.getDate() + n * 7);
  render();
}

document.getElementById("prev-week").addEventListener("click", () => shiftWeek(-1));
document.getElementById("next-week").addEventListener("click", () => shiftWeek(1));
document.getElementById("today-btn").addEventListener("click", () => {
  selected = new Date();
  weekStart = getMonday(selected);
  render();
});

render();

/* Menu */
const menuBtn = document.getElementById("menu-btn");
const drawer = document.getElementById("menu");
const overlay = document.getElementById("overlay");

function setMenu(open) {
  drawer.classList.toggle("is-open", open);
  drawer.setAttribute("aria-hidden", String(!open));
  menuBtn.setAttribute("aria-expanded", String(open));
  overlay.hidden = !open;
  if (open) drawer.querySelector("a").focus();
  else menuBtn.focus();
}

menuBtn.addEventListener("click", () => setMenu(true));
document.getElementById("menu-close").addEventListener("click", () => setMenu(false));
overlay.addEventListener("click", () => setMenu(false));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && drawer.classList.contains("is-open")) setMenu(false);
});
drawer.querySelectorAll("a").forEach((a) =>
  a.addEventListener("click", (e) => e.preventDefault())
);

</script>
</body>
</html>
